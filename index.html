<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Reach Report Consolidator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F9; --panel:#FFFFFF; --ink:#18212B; --muted:#5E6B7A; --line:#D8DEE6;
    --accent:#1D4F91; --accent-ink:#FFFFFF; --ok:#1B7A4B; --warn:#9A5200; --warn-bg:#FFF4E5;
    --err:#B3261E; --err-bg:#FDECEA; --grey:#C0C0C0;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  main{max-width:920px;margin:0 auto;padding:40px 20px 80px}
  h1{font-size:26px;line-height:1.2;margin:0 0 6px;font-weight:600;letter-spacing:-.01em}
  .lede{margin:0 0 28px;color:var(--muted);max-width:62ch}
  .settings{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;margin-bottom:18px}
  label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
  input[type=text],select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:220px}
  input[type=text]:focus-visible,select:focus-visible,button:focus-visible,.drop:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .drop{display:block;border:2px dashed #9AA7B6;border-radius:10px;background:var(--panel);padding:34px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
  .drop.over{border-color:var(--accent);background:#EEF3FA}
  .drop strong{display:block;font-size:17px;font-weight:600;margin-bottom:2px}
  .drop span{color:var(--muted);font-size:14px}
  .drop input{position:absolute;width:1px;height:1px;opacity:0}
  #list{margin-top:26px;display:flex;flex-direction:column;gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
  .card h2{font-size:16px;margin:0 0 12px;font-weight:600;word-break:break-all}
  .facts{display:flex;flex-wrap:wrap;gap:6px 24px;margin:0 0 14px;padding:0;font-size:14px}
  .facts div{display:flex;gap:6px}
  .facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:500}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
  .outname{margin:14px 0 0;font-size:13px;color:var(--muted);word-break:break-all}
  .outname b{color:var(--ink);font-weight:500}
  button.primary{font:inherit;font-weight:500;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 18px;cursor:pointer}
  button.primary:disabled{background:#B9C2CE;cursor:not-allowed}
  button.link{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
  .note{border-radius:6px;padding:9px 12px;font-size:14px;margin:0 0 12px}
  .note.warn{background:var(--warn-bg);color:var(--warn)} .note.err{background:var(--err-bg);color:var(--err)}
  .note ul{margin:4px 0 0;padding-left:18px}
  details{margin-top:14px;font-size:14px} summary{cursor:pointer;color:var(--muted)}
  .scroll{overflow-x:auto;margin-top:10px;border:1px solid var(--line)}
  table{border-collapse:collapse;font:12px/1.3 Arial,sans-serif;white-space:nowrap}
  th,td{border:1px solid #000;padding:3px 6px}
  th{background:var(--grey);font-weight:400;text-align:left} td.n{text-align:right}
  .resetbar{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  button.secondary{font:inherit;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid #9AA7B6;border-radius:6px;padding:9px 18px;cursor:pointer}
  button.secondary:hover{border-color:var(--ink)}
  button.secondary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hidden{display:none}
  .status{font-size:13px;color:var(--ok);margin-left:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Monthly Reach Report Consolidator</h1>
  <p class="lede">Pick a category, then upload a reach export (.xls or .xlsx). Each <em>Year</em> / 2024 / 2025 / 2026 block is merged into one table with a Year column on the right. The breakdown (Product, Brand or Copy) is read from the column headers.</p>

  <div class="settings">
    <label class="field">Category
      <select id="category"></select>
    </label>
    <label class="field hidden" id="newCatWrap">New category
      <input type="text" id="newCat" placeholder="Type a name, press Enter" autocomplete="off">
    </label>
    <label class="field">Period shown in file name
      <input type="text" id="period" value="FY2024 - Aug 2026" autocomplete="off">
    </label>
  </div>

  <label class="drop" id="drop" tabindex="0">
    <input type="file" id="file" accept=".xls,.xlsx,.xlsm" multiple>
    <strong>Drop reach files here, or click to choose</strong>
    <span>You can add several files; they all use the category selected above.</span>
  </label>

  <div id="list" aria-live="polite"></div>

  <div class="resetbar">
    <button type="button" class="primary" id="downloadAll" disabled>Download</button>
    <button type="button" class="secondary" id="reset">Reset</button>
    <span class="status" id="dlStatus"></span>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
// ==CORE==
/* ------------------------------------------------------------------
   Edit this list to change the starting categories in the dropdown.
   New categories added from the page are remembered in the browser.
------------------------------------------------------------------- */
const DEFAULT_CATEGORIES = [
  "Corporate",
  "ULCH GIT",
  "ULCH Herbals",
  "ULCH Respiratory",
  "ULCH Somatics",
  "ULCH VIMS",
  "Bone Health",
  "Women's Health",
  "ULSSI Beauty Ingestives",
  "ULSSI Feminine Care",
  "Acne Control",
  "ULSSI Facial Moisturizer",
  "ULSSI Facial Wash",
  "Hand & Body Lotion",
  "ULSSI Men's Facial Care",
  "Pedia TOTC",
  "Pedia Vitamins",
  "Westmont Antihistamine",
  "Westmont Acid Neutralizer",
  "Westmont Liver Protectants",
  "Westmont Anti-spasmodics"
];

const EXPECTED = {
  Product: ["Market","Target","Product","Advertiser","Month\\Variables","Universe","Reach 1+","Reach 2+","Reach 3+","Reach% 1+","Reach% 2+","Reach% 3+"],
  Brand:   ["Market","Target","Product","Brand","Advertiser","Month\\Variables","Universe","Reach 1+","Reach 2+","Reach 3+","Reach% 1+","Reach% 2+","Reach% 3+"],
  Copy:    ["Market","Target","Brand","Product","Advertiser","Duration","Copy","Month\\Variables","Universe","Reach 1+","Reach 2+","Reach 3+","Reach% 1+","Reach% 2+","Reach% 3+"]
};

// Column widths (Excel character units) taken from the reference export.
const WIDTHS = {market:10.5,target:10.5,product:10.5,brand:10.5,advertiser:10.5,duration:10.5,copy:10.5,
  month:2.6,universe:7.2,reach1:6.6,reach2:6.5,reach3:6.5,pct1:7.4,pct2:7.4,pct3:7.3,year:6};

const norm = v => String(v == null ? "" : v).replace(/\u00a0/g," ").replace(/\s+/g,"").replace(/[\\\/]/g,"\\").toLowerCase();
const isEmptyRow = (row, from, to) => { for (let i = from; i < to; i++) { if (String(row[i] == null ? "" : row[i]).trim() !== "") return false; } return true; };

function detectBreakdown(headers){
  const h = new Set(headers.map(norm));
  if (h.has("copy") || h.has("duration")) return "Copy";
  if (h.has("brand")) return "Brand";
  if (h.has("product") && h.has("advertiser")) return "Product";
  return null;
}

function colKey(header){
  const n = norm(header);
  if (n.startsWith("month")) return "month";
  if (n === "reach1+") return "reach1"; if (n === "reach2+") return "reach2"; if (n === "reach3+") return "reach3";
  if (n === "reach%1+") return "pct1"; if (n === "reach%2+") return "pct2"; if (n === "reach%3+") return "pct3";
  return n;
}
const isPct = k => k.startsWith("pct");
const isInt = k => k === "universe" || /^reach\d$/.test(k);

/** Find every "Year" cell that has 2024/2025/2026 (any 20xx) directly beneath it. */
function findBlocks(rows){
  const blocks = [];
  for (let r = 0; r < rows.length - 2; r++) {
    const row = rows[r] || [];
    for (let c = 0; c < row.length; c++) {
      if (norm(row[c]) !== "year") continue;
      const y = String((rows[r+1] || [])[c] == null ? "" : rows[r+1][c]).trim();
      if (!/^20\d\d$/.test(y)) continue;
      const hdrRow = rows[r+2] || [];
      let end = c; for (let i = c; i < hdrRow.length; i++) if (String(hdrRow[i] == null ? "" : hdrRow[i]).trim() !== "") end = i;
      const headers = hdrRow.slice(c, end + 1).map(x => String(x == null ? "" : x).replace(/\u00a0/g," ").trim());
      const data = [];
      for (let d = r + 3; d < rows.length; d++) {
        const dr = rows[d] || [];
        if (norm(dr[c]) === "year") break;
        if (isEmptyRow(dr, c, c + headers.length)) break;
        data.push(dr.slice(c, c + headers.length));
      }
      blocks.push({year:+y, headers, data});
      break;
    }
  }
  return blocks;
}

function parseWorkbookBuffer(buf){
  const wb = XLSX.read(buf, {type:"array"});
  const info = []; let dataSheet = null; const warnings = [];
  for (const name of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:""});
    const blocks = findBlocks(rows);
    if (blocks.length && !dataSheet) dataSheet = {name, blocks};
    else info.push({name, rows});
  }
  if (!dataSheet) throw new Error('No "Year" cell with 2024, 2025 or 2026 directly below it was found in this file.');

  const first = dataSheet.blocks[0];
  const breakdown = detectBreakdown(first.headers);
  if (!breakdown) throw new Error("Could not identify the breakdown from the column headers (" + first.headers.join(", ") + ").");

  const exp = EXPECTED[breakdown].map(norm), got = first.headers.map(norm);
  const missing = EXPECTED[breakdown].filter((h,i) => !got.includes(exp[i]));
  const extra = first.headers.filter(h => !exp.includes(norm(h)));
  if (missing.length) warnings.push("Expected columns not found for a " + breakdown + " file: " + missing.join(", ") + ".");
  if (extra.length) warnings.push("Extra columns kept as-is: " + extra.join(", ") + ".");

  const headers = first.headers.slice(), rows = [], years = [];
  const gotNorm = headers.map(norm);
  for (const b of dataSheet.blocks) {
    if (years.includes(b.year)) warnings.push("Year " + b.year + " appears more than once; all of its blocks were included.");
    years.push(b.year);
    const bn = b.headers.map(norm);
    if (bn.join("|") !== gotNorm.join("|")) {
      const lost = headers.filter((h,i) => !bn.includes(gotNorm[i]));
      warnings.push("The " + b.year + " block has different headers" + (lost.length ? " (missing: " + lost.join(", ") + ")" : "") + "; columns were matched by name.");
    }
    const map = gotNorm.map(n => bn.indexOf(n));
    for (const r of b.data) rows.push(map.map(i => i < 0 ? "" : r[i]).concat([b.year]));
  }
  const counts = dataSheet.blocks.map(b => ({year:b.year, rows:b.data.length}));
  return {breakdown, headers: headers.concat(["Year"]), rows, counts, years, info, dataSheetName: dataSheet.name, warnings, sheetOrder: wb.SheetNames};
}

function sanitizeName(s){ return String(s).replace(/[\\\/:*?"<>|]/g," ").replace(/\s+/g," ").trim(); }
function outputFileName(category, breakdown, period){
  return sanitizeName(category + " Monthly Reach Report by " + breakdown + " ao " + period) + ".xlsx";
}

async function buildWorkbook(parsed){
  const wb = new ExcelJS.Workbook();
  const thin = {style:"thin", color:{argb:"FF000000"}};
  const border = {top:thin, bottom:thin, left:thin, right:thin};
  const grey = {type:"pattern", pattern:"solid", fgColor:{argb:"FFC0C0C0"}};
  const font = {name:"Arial", size:10};

  for (const name of parsed.sheetOrder) {
    if (name === parsed.dataSheetName) {
      const ws = wb.addWorksheet(name.slice(0,31));
      const keys = parsed.headers.map(colKey);
      const hr = ws.addRow(parsed.headers); hr.height = 30;
      hr.eachCell(c => { c.font = font; c.fill = grey; c.border = border; c.numFmt = "@"; c.alignment = {horizontal:"left", vertical:"middle"}; });
      for (const r of parsed.rows) {
        const row = ws.addRow(r); row.height = 16.5;
        row.eachCell({includeEmpty:true}, (c, i) => {
          const k = keys[i-1]; c.font = font; c.border = border;
          if (k === "year") { c.numFmt = "0"; c.alignment = {horizontal:"left", vertical:"middle"}; }
          else if (isPct(k)) { c.numFmt = "#,##0.00%"; c.alignment = {horizontal:"right", vertical:"middle"}; }
          else if (isInt(k)) { c.numFmt = "#,##0"; c.alignment = {horizontal:"right", vertical:"middle"}; }
          else { c.numFmt = typeof c.value === "number" ? "General" : "@"; c.alignment = {horizontal:"left", vertical:"middle"}; }
        });
      }
      keys.forEach((k, i) => {
        const w = WIDTHS[k] || 10.5;
        ws.getColumn(i+1).width = w;
      });
      const monthIdx = keys.indexOf("month");
      ws.views = [{state:"frozen", xSplit: monthIdx >= 0 ? monthIdx + 1 : 0, ySplit: 1}];
    } else {
      const src = parsed.info.find(s => s.name === name); if (!src) continue;
      const ws = wb.addWorksheet(name.slice(0,31));
      for (const r of src.rows) { const row = ws.addRow(r); row.height = 14.5; row.eachCell({includeEmpty:true}, c => { c.font = {name:"Arial", size:10, bold:true}; c.alignment = {horizontal:"left", vertical:"bottom"}; }); }
      for (let i = 1; i <= 13; i++) ws.getColumn(i).width = 10.5;
    }
  }
  return wb;
}
// ==/CORE==

/* ------------------------------ UI ------------------------------ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = []; let nextId = 1; let category = "";
const NEW = "__new__";

function loadCategories(){
  let extra = [];
  try { extra = JSON.parse(localStorage.getItem("reachCategories") || "[]"); } catch (e) {}
  return Array.from(new Set(DEFAULT_CATEGORIES.concat(extra)));
}
function saveCategory(name){
  try {
    const extra = JSON.parse(localStorage.getItem("reachCategories") || "[]");
    if (!extra.includes(name) && !DEFAULT_CATEGORIES.includes(name)) { extra.push(name); localStorage.setItem("reachCategories", JSON.stringify(extra)); }
  } catch (e) {}
}

async function addFiles(fileList){
  for (const f of Array.from(fileList)) {
    const item = {id: nextId++, name: f.name};
    try {
      item.parsed = parseWorkbookBuffer(await f.arrayBuffer());
    } catch (e) { item.error = e.message || String(e); }
    state.push(item);
  }
  render();
}

function previewTable(p){
  const keys = p.headers.map(colKey);
  const head = "<tr>" + p.headers.map(h => "<th>" + esc(h) + "</th>").join("") + "</tr>";
  const body = p.rows.slice(0, 8).map(r => "<tr>" + r.map((v,i) => {
    const k = keys[i]; let s = v;
    if (typeof v === "number") s = isPct(k) ? (v*100).toFixed(2) + "%" : (k === "year" ? String(v) : v.toLocaleString("en-US"));
    return '<td class="' + (typeof v === "number" && k !== "year" ? "n" : "") + '">' + esc(s) + "</td>";
  }).join("") + "</tr>").join("");
  return '<div class="scroll"><table>' + head + body + "</table></div>";
}

function plannedNames(){
  const period = $("period").value.trim(), names = new Map(), used = {};
  if (!category || !period) return names;
  for (const it of state) {
    if (!it.parsed) continue;
    let n = outputFileName(category, it.parsed.breakdown, period);
    if (used[n]) { used[n]++; n = n.replace(/\.xlsx$/, " (" + used[n] + ").xlsx"); } else used[n] = 1;
    names.set(it.id, n);
  }
  return names;
}

function render(){
  const period = $("period").value.trim(), names = plannedNames();
  const okCount = state.filter(s => s.parsed).length;
  $("downloadAll").disabled = !names.size;
  $("downloadAll").textContent = okCount > 1 ? "Download all (" + okCount + " files)" : "Download";
  $("dlStatus").textContent = "";
  $("list").innerHTML = state.map(it => {
    if (it.error) return '<section class="card"><h2>' + esc(it.name) + '</h2><p class="note err">' + esc(it.error) + '</p><button class="link" data-remove="' + it.id + '">Remove</button></section>';
    const p = it.parsed, ready = category && period;
    const out = ready ? names.get(it.id) : "";
    return '<section class="card" data-id="' + it.id + '"><h2>' + esc(it.name) + '</h2>' +
      (p.warnings.length ? '<div class="note warn"><ul>' + p.warnings.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul></div>" : "") +
      '<dl class="facts"><div><dt>Breakdown</dt><dd>' + p.breakdown + '</dd></div>' +
      '<div><dt>Years</dt><dd>' + p.counts.map(c => c.year + " (" + c.rows + " rows)").join(", ") + '</dd></div>' +
      '<div><dt>Total rows</dt><dd>' + p.rows.length + '</dd></div></dl>' +
      '<div class="row"><button class="link" data-remove="' + it.id + '">Remove</button></div>' +
      '<p class="outname">' + (out ? "File name: <b>" + esc(out) + "</b>" : "Choose a category at the top of the page to see the file name.") + '</p>' +
      '<details><summary>Preview first rows</summary>' + previewTable(p) + '</details></section>';
  }).join("");
}

function renderCategories(){
  const sel = $("category"), cats = loadCategories();
  sel.innerHTML = '<option value="">Select a category</option>' + cats.map(c => '<option value="' + esc(c) + '"' + (c === category ? " selected" : "") + '>' + esc(c) + '</option>').join("") + '<option value="' + NEW + '">Add new category…</option>';
}

$("file").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
const drop = $("drop");
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
$("period").addEventListener("input", render);
renderCategories();
$("reset").addEventListener("click", () => {
  state.length = 0; category = "";
  $("file").value = ""; $("newCat").value = ""; $("newCatWrap").classList.add("hidden");
  renderCategories(); render();
  window.scrollTo({top: 0, behavior: "smooth"});
});

$("category").addEventListener("change", e => {
  if (e.target.value === NEW) { $("newCatWrap").classList.remove("hidden"); $("newCat").focus(); category = ""; }
  else { $("newCatWrap").classList.add("hidden"); category = e.target.value; }
  render();
});
$("newCat").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const name = e.target.value.trim(); if (!name) return;
  saveCategory(name); category = name; e.target.value = "";
  $("newCatWrap").classList.add("hidden"); renderCategories(); render();
});
$("list").addEventListener("click", e => {
  const rm = e.target.dataset.remove;
  if (rm) { state.splice(state.findIndex(s => s.id == rm), 1); render(); }
});

function saveBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

$("downloadAll").addEventListener("click", async e => {
  const btn = e.currentTarget, st = $("dlStatus"), names = plannedNames();
  const items = state.filter(s => s.parsed && names.has(s.id));
  if (!items.length) return;
  try {
    btn.disabled = true; st.textContent = "Building…";
    const built = [];
    for (const it of items) built.push({name: names.get(it.id), buf: await (await buildWorkbook(it.parsed)).xlsx.writeBuffer()});
    for (let i = 0; i < built.length; i++) {
      saveBlob(new Blob([built[i].buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), built[i].name);
      if (i < built.length - 1) await new Promise(r => setTimeout(r, 500));
    }
    st.textContent = built.length === 1 ? "Downloaded" : "Downloaded " + built.length + " files";
  } catch (err) { st.textContent = ""; alert("Could not build the file: " + (err.message || err)); }
  btn.disabled = false;
});
</script>
</body>
</html>
